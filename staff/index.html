<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapIt · Staff console</title><link rel="stylesheet" href="/app.css"></head><body><main class="login-view"><div class="login-card"><a class="brand" href="/">tap<span>!</span>it</a><p class="kicker">STAFF REWARD CONSOLE</p><h1>Issue a reward<br>with one tap.</h1><p>Choose a counter and stamp amount. The customer tap will be valid for 60 seconds.</p><form id="staff-form"><label>Counter<select id="counter"><option value="">Choose your counter</option></select></label><label>Customer email <input id="customer-email" type="email" placeholder="Manual stamp only"></label><label>Stamps to issue<select id="stamps"><option value="1">1 stamp</option><option value="2">2 stamps</option><option value="3">3 stamps</option></select></label><button class="primary">Enable customer tap <b>→</b></button><button class="primary" type="button" id="manual">Manual stamp / queue offline</button><output id="result"></output></form></div></main><script type="module" src="/staff/staff.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapIt · Staff console</title><link rel="stylesheet" href="/app.css"></head><body><main class="login-view" id="staff-login"><div class="login-card"><a class="brand" href="/">tap<span>!</span>it</a><p class="kicker">STAFF REWARD CONSOLE</p><h1>Ready to<br>reward?</h1><p>Sign in with the staff account your business owner created.</p><form id="staff-login-form"><label>Email<input id="staff-email" type="email" required autocomplete="email"></label><label>Password<input id="staff-password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in <b>→</b></button><output id="staff-login-error"></output></form></div></main><main class="login-view" id="staff-console" hidden><div class="login-card"><a class="brand" href="/">tap<span>!</span>it</a><p class="kicker">STAFF REWARD CONSOLE</p><h1>Issue a reward<br>with one tap.</h1><p>Enable the counter before the customer taps. The approval is valid for 60 seconds.</p><form id="staff-form"><label>Counter<select id="counter"><option value="">Choose your counter</option></select></label><label>Customer email <input id="customer-email" type="email" placeholder="Manual stamp only"></label><label>Stamps to issue<select id="stamps"><option value="1">1 stamp</option><option value="2">2 stamps</option><option value="3">3 stamps</option></select></label><button class="primary" type="submit">Enable customer tap <b>→</b></button><button class="primary" type="button" id="manual">Manual stamp / queue offline</button><button class="primary" type="button" id="staff-sign-out">Sign out</button><output id="result"></output></form></div></main><script type="module" src="/staff/staff.js"></script></body></html>
